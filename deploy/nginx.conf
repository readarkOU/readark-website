# readark.eu static site. TLS and compression negotiation happen in Caddy in front.
server {
    listen 80;
    server_name _;
    root /srv/site;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
